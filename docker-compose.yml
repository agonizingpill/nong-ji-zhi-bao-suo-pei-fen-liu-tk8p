name: ${COMPOSE_PROJECT_NAME:-warranty-field}
x-app: &app
  build: ./backend
  environment: &env
    DATABASE_URL: mysql+pymysql://field:fieldpass@db/field
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-warranty-field-demo-change-me}
    SEED_DEMO: 'true'
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-warranty-field}-frontend
    ports: ['${FRONTEND_PORT:-18221}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD','wget','-q','-O','/dev/null','http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-warranty-field}-backend
    ports: ['${BACKEND_PORT:-19221}:8000']
    healthcheck:
      test: ['CMD','python','-c','import urllib.request;urllib.request.urlopen("http://127.0.0.1:8000/health")']
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-warranty-field}-worker
    command: ['python','-m','src.worker']
    environment:
      <<: *env
      SEED_DEMO: 'false'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD','python','-c','import time,pathlib; assert time.time()-float(pathlib.Path("/artifacts/worker-heartbeat").read_text())<20']
      interval: 5s
      timeout: 3s
      retries: 30
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-warranty-field}-db
    environment:
      MYSQL_DATABASE: field
      MYSQL_USER: field
      MYSQL_PASSWORD: fieldpass
      MYSQL_ROOT_PASSWORD: localroot
    ports: ['${DB_PORT:-17721}:3306']
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: ['CMD','mysql','-h','127.0.0.1','-ufield','-pfieldpass','-D','field','-e','SELECT 1']
      interval: 5s
      timeout: 4s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-warranty-field}-redis
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  db-data:
  redis-data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: 10.221.22.0/24
